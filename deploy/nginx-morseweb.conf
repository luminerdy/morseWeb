# nginx site for morseWeb. Installed by deploy/setup_server.sh to
# /etc/nginx/sites-available/morseweb (with YOUR_DOMAIN substituted).
# The rate-limit zones referenced below (limit_req/limit_conn) are
# declared in nginx-rate-limits.conf, which setup_server.sh installs
# to conf.d/ - they can't live in this file's server{} block.
#
# certbot --nginx adds the TLS server block and the HTTP->HTTPS
# redirect after this file is in place; keep this file HTTP-only.
# When certbot duplicates the location blocks into its new HTTPS
# server{}, it copies these limit_req/limit_conn lines along with them.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Matches the app's MAX_CONTENT_LENGTH (16 KB JSON posts).
    client_max_body_size 16k;

    location /static/ {
        alias /opt/morseweb/app/static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        limit_req zone=morseweb_general burst=20 nodelay;
        limit_conn morseweb_perip 20;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
