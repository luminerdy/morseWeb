# Shared rate-limit zones for the morseWeb site block. limit_req_zone
# and limit_conn_zone can only be declared in nginx's http{} context,
# not inside server{}, so this lives separately in conf.d/ (which
# Ubuntu's stock nginx.conf includes automatically) rather than in
# nginx-morseweb.conf itself.
#
# This protects the server - two gunicorn workers in front of SQLite -
# from being saturated by a request flood, whether an organic traffic
# spike or deliberate abuse. It's independent of and in addition to
# Flask-Limiter's per-route limits in auth.py, which only cover
# signup/login/reset/demo; every other route (the practice/progress
# endpoints that do the real work) had no rate limit before this.
#
# 10 MB zone ~= 160,000 tracked IPs at once - far more than this site
# will ever see; sized for headroom, not because it's needed.
limit_req_zone $binary_remote_addr zone=morseweb_general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=morseweb_perip:10m;
